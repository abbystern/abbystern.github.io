<section class="connect-panel" aria-labelledby="connect-title">
  <p class="eyebrow">{{ page.connect_eyebrow }}</p>
  <h2 id="connect-title">{{ page.connect_heading }}</h2>
  <p>{{ page.connect_description }}</p>
  <div class="link-row">
    <a class="button-link" href="mailto:{{ site.email }}">Email Abby</a>
    <a class="button-link secondary" href="{{ site.linkedin_url }}" rel="noopener noreferrer">Find me on LinkedIn</a>
  </div>
</section>
